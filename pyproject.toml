[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = [
    "approval",
    "api",
    "database",
    "flowpilot",
    "llm_response_generator",
    "response_generator",
    "ui",
]
